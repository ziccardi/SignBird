server.address=127.0.0.1
server.port=8083
server.error.include-message=never
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
spring.servlet.multipart.file-size-threshold=0
spring.servlet.multipart.location=${SIGNBIRD_DOCUMENT_UPLOAD_DIR:${java.io.tmpdir}}
spring.sql.init.mode=always
spring.datasource.url=${SIGNBIRD_DOCUMENT_DATABASE_URL}
spring.datasource.username=${SIGNBIRD_DOCUMENT_DATABASE_USER}
spring.datasource.password=${SIGNBIRD_DOCUMENT_DATABASE_PASSWORD}
